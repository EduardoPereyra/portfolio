<div class="fixed right-0 bottom-20">
  <div class="space-y-2 p-4">
    @if (type() === 'success') {
      <div
        role="alert"
        class="bg-green-200 border-l-4 border-green-50 text-green-900 p-4 rounded-lg flex items-center transition duration-300 ease-in-out hover:bg-green-300 transform hover:scale-105"
      >
        <svg
          stroke="currentColor"
          viewBox="0 0 24 24"
          fill="none"
          class="h-5 w-5 shrink-0 mr-2 text-green-600"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M13 16h-1v-4h1m0-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
            stroke-width="2"
            stroke-linejoin="round"
            stroke-linecap="round"
          ></path>
        </svg>
        <p class="text-sm font-semibold">Success - {{ message() }}</p>
      </div>
    }
    @if (type() === 'info') {
      <div
        role="alert"
        class="bg-blue-200 border-l-4 border-blue-500 text-blue-900 p-4 rounded-lg flex items-center transition duration-300 ease-in-out hover:bg-blue-300 transform hover:scale-105"
      >
        <svg
          stroke="currentColor"
          viewBox="0 0 24 24"
          fill="none"
          class="h-5 w-5 shrink-0 mr-2 text-blue-600"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M13 16h-1v-4h1m0-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
            stroke-width="2"
            stroke-linejoin="round"
            stroke-linecap="round"
          ></path>
        </svg>
        <p class="text-sm font-semibold">Info - {{ message() }}</p>
      </div>
    }

    @if (type() === 'warning') {
      <div
        role="alert"
        class="bg-yellow-200 border-l-4 border-yellow-500 text-yellow-900 p-4 rounded-lg flex items-center transition duration-300 ease-in-out hover:bg-yellow-300 transform hover:scale-105"
      >
        <svg
          stroke="currentColor"
          viewBox="0 0 24 24"
          fill="none"
          class="h-5 w-5 shrink-0 mr-2 text-yellow-600"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M13 16h-1v-4h1m0-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
            stroke-width="2"
            stroke-linejoin="round"
            stroke-linecap="round"
          ></path>
        </svg>
        <p class="text-sm font-semibold">Warning - {{ message() }}</p>
      </div>
    }

    @if (type() === 'error') {
      <div
        role="alert"
        class="bg-red-200 border-l-4 border-red-500 text-red-900 p-4 rounded-lg flex items-center transition duration-300 ease-in-out hover:bg-red-300 transform hover:scale-105"
      >
        <svg
          stroke="currentColor"
          viewBox="0 0 24 24"
          fill="none"
          class="h-5 w-5 shrink-0 mr-2 text-red-600"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M13 16h-1v-4h1m0-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
            stroke-width="2"
            stroke-linejoin="round"
            stroke-linecap="round"
          ></path>
        </svg>
        <p class="text-sm font-semibold">Error - {{ message() }}</p>
      </div>
    }
  </div>
</div>

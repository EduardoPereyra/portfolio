<div class="request-modal-backdrop">
  <section class="request-modal" aria-label="Send project request">
    <button
      type="button"
      class="close-button"
      (click)="onClick(undefined, undefined)"
      aria-label="Close request options"
    >
      ×
    </button>

    <div class="request-header">
      <p class="modal-eyebrow">Request ready</p>
      <h2>Send project request</h2>
      <p>
        Your selected technologies and contact details are prepared as a structured project brief.
      </p>
    </div>

    @if (checkoutEmail) {
      <div class="request-preview">
        <span>Email subject</span>
        <strong>{{ checkoutEmail.subject }}</strong>
      </div>
    }

    <div class="request-actions">
      <button type="button" class="primary-action" (click)="sendByEmail($event)">
        Open email app
      </button>
      <button type="button" class="secondary-action" (click)="copyToClipboard($event)">
        Copy request
      </button>
    </div>

    <button type="button" class="ghost-action" (click)="onClick(undefined, undefined)">
      Cancel
    </button>
  </section>
</div>

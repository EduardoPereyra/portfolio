<div class="bg-zinc-900/50 z-20 fixed top-0 left-0 w-full h-full flex items-center justify-center">
  <div class="relative p-0 md:m-40 md:w-1/3 h-auto w-full m-2">
    <div class="scale-up-center p-8 m-0 bg-white rounded flex flex-col">
      <h1>Send request by:</h1>
      <button
        type="button"
        (click)="sendByEmail($event)"
        class="mt-6 px-4 py-2 bg-emerald-700 text-white rounded hover:bg-emerald-900 transition-colors duration-300 cursor-pointer"
      >
        Email
      </button>
      <button
        type="button"
        (click)="copyToClipboard($event)"
        class="mt-6 px-4 py-2 bg-emerald-700 text-white rounded hover:bg-emerald-900 transition-colors duration-300 cursor-pointer"
      >
        Copy to clipboard
      </button>

      <button
        type="button"
        (click)="onClick(undefined, undefined)"
        class="mt-4 px-4 py-2 text-emerald-700 rounded hover:text-emerald-900 hover:bg-slate-200 transition-colors duration-300 cursor-pointer"
      >
        Cancel
      </button>
    </div>
  </div>
</div>

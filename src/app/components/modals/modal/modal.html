<div class="certificate-modal-backdrop" (click)="onClick()">
  <section class="certificate-modal" (click)="$event.stopPropagation()" aria-label="Certificate preview">
    <header class="certificate-modal-header">
      <div>
        <span>Certificate preview</span>
        <h2>{{ title }}</h2>
      </div>
      <button type="button" class="close-button" (click)="onClick()" aria-label="Close certificate">
        ×
      </button>
    </header>

    <div class="certificate-modal-body">
      <img
        [ngSrc]="`assets/certificates/${imageName}.jpg`"
        alt="{{ title }}"
        width="1200"
        height="850"
      />
    </div>
  </section>
</div>

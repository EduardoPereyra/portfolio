<div
  class="bg-zinc-900/50 z-20 fixed top-0 left-0 w-full h-full flex items-center justify-center cursor-pointer"
  (click)="onClick()"
>
  <div class="relative p-0 md:m-40 md:w-1/3 h-auto w-full m-2">
    <div class="scale-up-center p-8 m-0 bg-white rounded">
      @if (item.tag) {
        <div
          class="best-seller absolute top-8 left-8 {{
            item.tagColor ?? 'bg-emerald-500'
          }} text-white text-xs font-normal px-1 rounded"
        >
          <span>{{ item.tag }}</span>
        </div>
      }
      <!-- <div class="bg-slate-100 w-full py-4"> -->
      @if (item.img) {
        <img
          class="w-auto h-16 mx-auto max-w-4/5 object-contain"
          [ngSrc]="item.img"
          alt="{{ item.name }}"
          width="60"
          height="20"
        />
      }
      <!-- </div> -->
      <p class="text-center mt-2 text-xl text-emerald-700">{{ item.name }}</p>
      <div
        class="flex justify-center mt-2 pb-4"
        (mouseover)="hoverStars = true"
        (mouseleave)="hoverStars = false"
      >
        @if (hoverStars) {
          <div
            class="flex items-center justify-center text-emerald-900 text-sm font-semibold bg-zinc-100 px-2 py-1 m-0 rounded"
          >
            {{ item.experience }}
          </div>
        } @else {
          @for (star of [1, 2, 3, 4, 5]; track star) {
            <fa-icon
              class="w-4 h-4 mx-sm"
              [icon]="faStar"
              aria-label="star"
              aria-hidden="false"
              [class.text-yellow-500]="star <= item.level"
              [class.text-gray-300]="star > item.level"
            ></fa-icon>
          }
        }
      </div>
      <p class="text-justify">{{ item.description }}</p>
    </div>
  </div>
</div>

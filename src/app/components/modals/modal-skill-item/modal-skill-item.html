<div class="skill-modal-backdrop" (click)="onClick()">
  <section class="skill-modal" (click)="$event.stopPropagation()" aria-label="Technology detail">
    <button type="button" class="close-button" (click)="onClick()" aria-label="Close technology detail">
      ×
    </button>

    <div class="skill-visual">
      @if (item.tag) {
        <span class="skill-tag {{ item.tagColor ?? 'bg-emerald-500' }}">{{ item.tag }}</span>
      }
      @if (item.img) {
        <img [ngSrc]="item.img" alt="{{ item.name }}" width="180" height="120" />
      }
    </div>

    <div class="skill-detail">
      <p class="modal-eyebrow">Technology profile</p>
      <h2>{{ item.name }}</h2>

      <div class="skill-meta">
        <span class="experience-pill">{{ item.experience }}</span>
        <span class="rating" aria-label="Skill level">
          @for (star of [1, 2, 3, 4, 5]; track star) {
            <fa-icon
              [icon]="faStar"
              aria-hidden="true"
              [class.text-yellow-500]="star <= item.level"
              [class.text-gray-300]="star > item.level"
            ></fa-icon>
          }
        </span>
      </div>

      <p class="skill-description">{{ item.description }}</p>
    </div>
  </section>
</div>

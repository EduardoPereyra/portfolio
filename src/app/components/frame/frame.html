<button type="button" class="certificate-card" (click)="onClick()">
  <span class="certificate-preview" aria-hidden="true">
    <img
      [ngSrc]="`assets/certificates/${imageName}.jpg`"
      alt=""
      width="420"
      height="300"
    />
  </span>
  <span class="certificate-copy">
    <span class="certificate-label">Certificate</span>
    <span class="certificate-title">{{ title }}</span>
    <span class="certificate-action">View credential</span>
  </span>
</button>

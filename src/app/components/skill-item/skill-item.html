<article
  class="skill-card"
  (mouseover)="showCart = true"
  (mouseleave)="showCart = false"
>
  @if (skill.tag) {
    <div class="skill-tag {{ skill.tagColor ?? 'bg-emerald-500' }}">
      <span>{{ skill.tag }}</span>
    </div>
  }

  @if (!added) {
    <button
      class="cart-action"
      [class.is-visible]="showCart"
      (click)="addToCart(skill); $event.stopPropagation()"
      aria-label="Add {{ skill.name }} to cart"
    >
      <fa-icon [icon]="faCartArrowDown" aria-hidden="true"></fa-icon>
    </button>
  }

  @if (added) {
    <div class="cart-action is-added" aria-label="{{ skill.name }} added to cart">
      <fa-icon [icon]="faCheck" aria-hidden="true"></fa-icon>
    </div>
  }

  <button type="button" class="skill-content" (click)="onClick()">
    <span class="skill-media">
      <img [src]="skill.img" [alt]="skill.name" />
    </span>
    <span class="skill-name">{{ skill.name }}</span>
    <span
      class="skill-rating"
      (mouseover)="hoverStars = true"
      (mouseleave)="hoverStars = false"
    >
      @if (hoverStars) {
        <span class="experience-pill">{{ skill.experience }}</span>
      } @else {
        @for (star of [1, 2, 3, 4, 5]; track star) {
          <fa-icon
            [icon]="faStar"
            aria-label="star"
            aria-hidden="false"
            [class.text-yellow-500]="star <= skill.level"
            [class.text-gray-300]="star > skill.level"
          ></fa-icon>
        }
      }
    </span>
  </button>
</article>
